name: Build Debug APK

# يشتغل تلقائيًا كل ما ترفع كود جديد على أي فرع، وتقدر أيضًا تشغّله يدويًا من تبويب Actions
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # يثبّت أداة Gradle نفسها على السيرفر (المشروع ما يحتوي على gradlew جاهز)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: soldiers-bluetooth-game-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
